name: Go App GitHub Flow Automation Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy Go App to WSL2
    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Clean host environment
        run: |
          if [ "$(sudo docker ps -aq -f name=go-demo-container)" ]; then
            sudo docker stop go-demo-container
            sudo docker rm go-demo-container
          fi

      - name: Compile Docker Image
        run: sudo docker build --pull -t go-demo-app:latest .

      - name: Deploy New Container
        run: sudo docker run -d --name go-demo-container -p 8888:8888 --restart always go-demo-app:latest

      - name: Integration Integration Test Health Check
        run: |
          sleep 4
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8888/)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Success 200 OK"
          else
            echo "Failed"
            exit 1
          fi
